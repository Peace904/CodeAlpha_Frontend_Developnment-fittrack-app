<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitTrack</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- LOGIN AND SIGN-UP SCREEN -->
  <div id="auth-screen" class="auth-screen">

    <div class="brand">
      <div class="logo">💪</div>
      <h1>FitTrack</h1>
      <p>Train. Track. Improve.</p>
    </div>

    <!-- Login form -->
    <form id="login-form" class="auth-card">
      <h2>Welcome back</h2>

      <label>Email
        <input type="email" id="login-email" autocomplete="email" required />
      </label>

      <label>Password
        <input type="password" id="login-password" autocomplete="current-password" required />
      </label>

      <p class="form-error" id="login-error"></p>

      <button type="submit" class="primary-btn">Log in</button>

      <p class="switch-text">
        New here? <a href="#" id="show-register">Create an account</a>
      </p>
    </form>

    <!-- Sign-up form -->
    <form id="register-form" class="auth-card hidden">
      <h2>Create your account</h2>

      <label>Name
        <input type="text" id="register-name" autocomplete="name" maxlength="50" required />
      </label>

      <label>Email
        <input type="email" id="register-email" autocomplete="email" required />
      </label>

      <label>Password (at least 6 characters)
        <input type="password" id="register-password" autocomplete="new-password" minlength="6" maxlength="72" required />
      </label>

      <p class="form-error" id="register-error"></p>

      <button type="submit" class="primary-btn">Sign up</button>

      <p class="switch-text">
        Already have an account? <a href="#" id="show-login">Log in</a>
      </p>
    </form>

  </div>

  <!-- MAIN APP (shown after login, we build it later) -->
  <div id="app-screen" class="hidden"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
